[package]
name = "rusty-pomodoro"
default-run = "rusty-pomodoro"
version = "0.1.0"
edition = "2021"
description = "Low-memory Rust Pomodoro timer with native macOS UI and optional egui"

[[bin]]
name = "rusty-pomodoro"
path = "src/main.rs"

[[bin]]
name = "rusty-pomodoro-slint"
path = "src/slint_main.rs"
required-features = ["slint-ui"]

[features]
default = []
egui-ui = ["dep:eframe", "dep:egui"]
slint-ui = ["dep:slint"]

[dependencies]
eframe = { version = "0.36", optional = true, default-features = false, features = ["glow", "x11"] }
egui = { version = "0.36.2", optional = true, default-features = false }
libc = "0.2"
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "unstable-winit-030"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSNotification", "NSTimer", "NSRunLoop", "NSGeometry", "NSDate", "NSData", "NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSResponder", "NSView", "NSSound", "NSWorkspace", "NSWindow", "NSFont", "NSTextField", "NSPopUpButton", "NSScrollView", "NSClipView", "NSAlert", "NSAppearance", "NSColor", "NSProgressIndicator", "NSEvent", "objc2-core-foundation", "NSGraphics", "NSText", "NSCell", "NSRunningApplication", "NSFontDescriptor", "NSImage"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
